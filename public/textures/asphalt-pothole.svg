  <filter id="s" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.10" numOctaves="6" seed="11" result="grain"/>
    <feDiffuseLighting in="grain" lighting-color="#75777A" surfaceScale="4" diffuseConstant="1" result="lit">
      <feDistantLight azimuth="228" elevation="52"/>
    </feDiffuseLighting>
    <feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="3" seed="4" result="blotchRaw"/>
    <feColorMatrix in="blotchRaw" type="saturate" values="0" result="blotchGray"/>
    <feComponentTransfer in="blotchGray" result="blotch">
      <feFuncR type="linear" slope="0.55" intercept="0.725"/>
      <feFuncG type="linear" slope="0.55" intercept="0.725"/>
      <feFuncB type="linear" slope="0.55" intercept="0.725"/>
    </feComponentTransfer>
    <feBlend in="lit" in2="blotch" mode="multiply" result="mixed"/>
    <feComponentTransfer in="mixed" result="graded">
      <feFuncR type="linear" slope="1" intercept="0"/>
      <feFuncG type="linear" slope="1" intercept="0"/>
      <feFuncB type="linear" slope="1" intercept="0"/>
    </feComponentTransfer>
    <feComposite in="graded" in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="rough" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="63" result="warp"/>
    <feDisplacementMap in="SourceGraphic" in2="warp" scale="16" xChannelSelector="R" yChannelSelector="G"/>
  </filter><radialGradient id="depth" cx="0.42" cy="0.34" r="0.78">
      <stop offset="0" stop-color="#1B1C1F"/>
      <stop offset="0.45" stop-color="#0A0B0C"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <!-- Standing water: a cold sky reflection, brightest where the light is. -->
    <linearGradient id="water" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#9AA5AC" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#6E777E" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3A4045" stop-opacity="0.75"/>
    </linearGradient>
  <linearGradient id="vig" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0.48"/>
  </linearGradient></defs>
